<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DJ Wizard Sleeve</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <img id="logo" src="djwizardsleeve.com_logo.png" alt="DJ Wizard Sleeve logo">

  <script>
    // Add your other logo filenames here, in the order you want them to cycle
    const logos = [
      "djwizardsleeve.com_logo.png",
      "djwizardsleeve.com_logo2.png",
      "djwizardsleeve.com_logo3.png"
    ];

    let currentIndex = 0;
    const logoImg = document.getElementById("logo");

    logoImg.addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % logos.length;
      logoImg.src = logos[currentIndex];
    });
  </script>
</body>
</html>
